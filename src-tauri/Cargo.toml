[package]
name = "film-baz"
version = "0.1.0"
description = "FILM BAZ — Persian-language media library manager for Windows desktop"
authors = ["FILM BAZ"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "film_baz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
